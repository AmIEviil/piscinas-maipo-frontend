server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx.
    server_tokens off;

    # Cabeceras de seguridad de la SPA. `helmet()` en el backend solo protege
    # las respuestas de la API; esta aplicación la sirve nginx, que hasta ahora
    # no enviaba ninguna cabecera de seguridad.
    #
    # Content-Security-Policy: sin esto, un XSS puede leer directamente el
    # token de sesión desde localStorage y enviarlo a un tercero.
    # - 'unsafe-inline' en style-src es necesario mientras MUI y Tailwind
    #   inyecten estilos en línea; en script-src NO se permite.
    # - connect-src debe incluir la URL del backend al desplegar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS. Solo tiene efecto sobre HTTPS; el navegador la ignora en HTTP.
    # Activarla cuando el proxy inverso ya sirva TLS con certificado válido.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
