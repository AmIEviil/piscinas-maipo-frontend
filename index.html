<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/piscinasElMaipo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Sistema de gestión integral de piscinas y mantenciones" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Piscinas Maipo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Piscinas el Maipo</title>
    <script>
      // Aplica el nivel de tamano de letra antes del primer render, para que la
      // pagina no aparezca en tamano normal y salte al elegido. La clave y los
      // pasos deben coincidir con src/store/A11yStore.ts.
      (function () {
        try {
          var steps = [100, 112.5, 125, 137.5, 150];
          var raw = localStorage.getItem("piscinas-font-scale-level");
          var level = Math.min(steps.length - 1, Math.max(0, Math.round(Number(raw))));
          if (raw !== null && isFinite(level)) {
            document.documentElement.style.fontSize = steps[level] + "%";
          }
        } catch (e) {
          /* sin almacenamiento: se usa el tamano por defecto */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
