name: CI Check (Quality Control)

# Corre en toda rama menos main, y en los Pull Requests hacia main y hacia dev.
#
# Antes solo cubria los pushes a 'dev' y los PR hacia 'main': una rama de
# trabajo podia acumular commits sin que se validara nada, y como el flujo de
# este repositorio integra en 'dev', el PR de una rama de feature tampoco
# disparaba el check. Se alinea con el ci-check.yml del backend.
#
# 'main' se excluye del push a proposito: ahi ya corre deploy.yml, y validar
# despues de desplegar no sirve de nada.
on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main", "dev"]
  # Permite lanzarlo a mano desde la pestana Actions sobre cualquier rama.
  workflow_dispatch:

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest

    steps:
      # Descargar el código
      - name: Checkout Code
        uses: actions/checkout@v4

      # Preparar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5" # Usa la versión que tengas en tu servidor
          cache: "yarn"

      # 3. Instalar dependencias
      # --frozen-lockfile asegura que se instalen las versiones exactas del yarn.lock
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Revisión de Calidad (Linting)
      # Esto usará tu eslint.config.js para detectar errores de sintaxis o malas prácticas
      - name: Run Linter
        run: yarn lint

      # Verificación de Compilación (Build Test)
      # Al ser TypeScript, esto también verifica que no haya errores de tipos (tsc -b)
      # Si esto falla, el pipeline se detiene y no deja pasar a producción.
      - name: Verify Build
        run: yarn build
